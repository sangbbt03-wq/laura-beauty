<style>
:root{--pearl:#F8F5F1;--silver:#BFC0C4;--lav:#A985C8;--deep:#73528F;--char:#29272C;--w:#fff;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:var(--sans);background:var(--pearl);color:var(--char);line-height:1.6;padding-bottom:70px}
img{max-width:100%;display:block}a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}h2{font-size:clamp(1.8rem,4vw,2.7rem);text-align:center;margin-bottom:2rem}
.wrap{max-width:1120px;margin:auto;padding:0 20px}section{padding:72px 0}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.btn{display:inline-block;border:0;cursor:pointer;font:600 .95rem var(--sans);letter-spacing:.06em;padding:15px 28px;border-radius:2px;text-decoration:none;position:relative;overflow:hidden;transition:.3s}
.btn-p{background:var(--char);color:#fff}.btn-p:hover{background:var(--deep)}
.btn-p::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:.6s}
.btn-p:hover::after{left:130%}
.btn-s{border:1px solid var(--char);color:var(--char);background:transparent}.btn-s:hover{background:var(--char);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
header{position:fixed;top:0;left:0;right:0;z-index:50;transition:.3s}
header.sc{background:rgba(248,245,241,.94);backdrop-filter:blur(8px);box-shadow:0 1px 12px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-family:var(--serif);font-size:1.3rem;letter-spacing:.14em;text-decoration:none;font-weight:600}.logo b{color:var(--deep)}
nav ul{display:flex;gap:24px;list-style:none;align-items:center}nav a{text-decoration:none;font-size:.9rem}
.right{display:flex;gap:10px;align-items:center}
.lang{background:none;border:1px solid var(--silver);padding:6px 10px;cursor:pointer;font:500 .8rem var(--sans);border-radius:2px}
.burger{display:none;background:none;border:0;font-size:1.6rem;cursor:pointer;width:44px;height:44px}
.hero{padding-top:110px;min-height:100vh;display:flex;align-items:center;background:radial-gradient(circle at 80% 30%,#ece4f3,transparent 55%)}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.eyebrow{letter-spacing:.3em;font-size:.8rem;color:var(--deep);font-weight:600;margin-bottom:12px}
.hero p.d{margin:18px 0;max-width:480px;color:#4a474d}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.chips span{border:1px solid var(--silver);padding:5px 12px;border-radius:30px;font-size:.82rem;background:#fff}
.price{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:18px 0}
.old{text-decoration:line-through;color:#8a878d}.new{font:600 2.2rem var(--serif);color:var(--deep)}
.save{background:var(--deep);color:#fff;font-size:.78rem;padding:3px 10px;border-radius:30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-img{position:relative;animation:zoom 1.4s ease both}.hero-img{max-width:560px;width:100%;margin-inline:auto}.hero-img img{border-radius:8px;box-shadow:0 24px 55px rgba(115,82,143,.18);aspect-ratio:1/1;object-fit:contain;object-position:center;width:100%;background:#f3edf6}
.hero-img::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:250% 100%;animation:shine 5s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
@keyframes zoom{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.hero .wrap>div:first-child>*{animation:up .8s both}
.hero .wrap>div:first-child>*:nth-child(2){animation-delay:.15s}.hero .wrap>div:first-child>*:nth-child(3){animation-delay:.3s}.hero .wrap>div:first-child>*:nth-child(n+4){animation-delay:.45s}
.rv{opacity:0;transform:translateY(28px);transition:.8s}.rv.in{opacity:1;transform:none}
.gal{display:grid;grid-template-columns:1fr;gap:14px;max-width:640px;margin:auto}
.gal .main{cursor:zoom-in;border-radius:6px;overflow:hidden;background:#fff}.gal .main img{width:100%;aspect-ratio:1/1;max-height:620px;object-fit:contain;object-position:center;transition:opacity .35s;background:#f7f2f8}
.thumbs{display:flex;gap:10px;justify-content:center}.thumbs button{width:76px;height:76px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;cursor:pointer;opacity:.65;transition:.25s;background:#fff}
.thumbs button.on{border-color:var(--deep);opacity:1;transform:translateY(-3px)}.thumbs img{width:100%;height:100%;object-fit:cover}
.lb{position:fixed;inset:0;background:rgba(20,18,22,.92);z-index:100;display:none;align-items:center;justify-content:center}
.lb.open{display:flex}.lb img{max-width:92vw;max-height:88vh;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer;width:56px;height:56px}
.lb .x{top:10px;right:10px}.lb .pv{left:6px}.lb .nx{right:6px}
.priceBox{text-align:center;background:#fff;padding:40px 20px;border-radius:6px;max-width:560px;margin:auto}
.priceBox .price{justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.card{background:#fff;padding:26px 20px;text-align:center;border-radius:6px;transition:.3s;border:1px solid #eee}.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
.card .ic{font-size:1.9rem;color:var(--deep);margin-bottom:8px}.card p{font-size:.9rem;color:#5a575d}
.story{background:var(--w);text-align:center}.story p{max-width:640px;margin:0 auto 1.2rem;font-size:1.05rem}.story img{width:min(760px,100%);height:auto;aspect-ratio:16/9;object-fit:contain;margin:28px auto 0;border-radius:8px;background:var(--pearl)}
.acc{max-width:760px;margin:auto}.acc details{background:#fff;border-radius:4px;margin-bottom:10px;border:1px solid #eee}
.acc summary{cursor:pointer;padding:16px 20px;font-weight:500;list-style:none;display:flex;justify-content:space-between}.acc summary::after{content:"+";color:var(--deep);font-size:1.3rem}
.acc details[open] summary::after{content:"–"}.acc .a{padding:0 20px 18px;color:#4a474d;font-size:.95rem}
.note{max-width:760px;margin:16px auto 0;font-size:.8rem;color:#777;text-align:center}
.formbox{max-width:620px;margin:auto;background:#fff;padding:36px 28px;border-radius:6px;box-shadow:0 20px 50px rgba(115,82,143,.12)}
.timer{text-align:center;font-size:.9rem;margin-bottom:16px;color:var(--deep);font-weight:600}.timer small{display:block;color:#777;font-weight:400}
.f{margin-bottom:16px}.f label{display:block;font-size:.88rem;font-weight:500;margin-bottom:5px}
.f input,.f textarea{width:100%;padding:13px;border:1px solid var(--silver);border-radius:3px;font:1rem var(--sans);background:var(--pearl)}
.f input:focus,.f textarea:focus{outline:2px solid var(--lav);border-color:var(--lav)}
.f.err input,.f.err textarea{border-color:#c0392b}.em{color:#c0392b;font-size:.8rem;min-height:1em}
.total{display:flex;justify-content:space-between;font-weight:600;border-top:1px solid #eee;padding-top:14px;margin-bottom:16px}
.hp{position:absolute;left:-9999px}
.msg{margin-top:18px;padding:16px;border-radius:4px;font-size:.95rem;display:none}.msg.ok{display:block;background:#eef7ee;border:1px solid #9bc89b}.msg.bad{display:block;background:#fdf0ee;border:1px solid #e3a69d}
footer{background:var(--char);color:#ddd;text-align:center;padding:30px 20px;font-size:.85rem}
.float{position:fixed;right:14px;bottom:84px;z-index:60;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.fb{width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;color:#fff;font:700 .78rem var(--sans);box-shadow:0 6px 16px rgba(0,0,0,.25);position:relative;animation:wob 4s infinite}
.fb.z{background:#0068FF}.fb.p{background:var(--deep);font-size:1.4rem;animation-delay:1.5s}
.fb::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;animation:pulse 2.2s infinite;opacity:.6}
.fb.z::before{color:#0068FF}.fb.p::before{color:var(--deep)}.fb.seen,.fb.seen::before{animation:none}
@keyframes pulse{to{transform:scale(1.6);opacity:0}}
@keyframes wob{0%,86%,100%{transform:none}90%{transform:rotate(-12deg)}94%{transform:rotate(10deg)}97%{transform:rotate(-6deg)}}
.fb[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:62px;top:50%;transform:translateY(-50%);background:var(--char);color:#fff;padding:4px 10px;border-radius:3px;font:500 .75rem var(--sans);white-space:nowrap}
.pop{position:fixed;right:78px;bottom:90px;z-index:70;background:#fff;padding:18px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;min-width:230px}.pop.open{display:block}
.pop b{display:block;font-size:1.3rem;margin:4px 0 12px}.pop .btn{padding:10px 14px;font-size:.8rem;margin:2px}.pop small{color:#c0392b;display:block;margin-top:6px;font-size:.75rem}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.1);padding:10px 16px;display:none;justify-content:space-between;align-items:center;transition:transform .3s}
.sticky.hide{transform:translateY(110%)}
@media(max-width:820px){
 .hero-img{max-width:520px}.hero-img img{aspect-ratio:1/1}.gal{max-width:100%}.gal .main img{max-height:none}.story img{aspect-ratio:16/9}
 nav ul{display:none;position:absolute;top:64px;left:0;right:0;background:var(--pearl);flex-direction:column;padding:18px;box-shadow:0 10px 20px rgba(0,0,0,.1)}nav ul.open{display:flex}
 .burger{display:block}.hide-m{display:none}.hero .wrap{grid-template-columns:1fr}.hero{min-height:0;padding-bottom:40px}
 .sticky.show{display:flex}.float{bottom:80px}.pop{right:14px;bottom:150px}section{padding:52px 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>

let gi=0;

function render(){
 document.documentElement.lang=lang;$('#langBtn').textContent=lang==='vi'?'EN':'VI';
 $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 $$('[data-p]').forEach(e=>e.textContent=fmt(CONFIG[e.dataset.p==='sale'?'PRODUCT_PRICE':'ORIGINAL_PRICE']));
 $('#featGrid').innerHTML=t('feats').map(f=>`<div class="card rv"><div class="ic">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('');
 const P=CONFIG.POLICIES[lang];
 $('#polGrid').innerHTML=P.map(p=>`<div class="card"><div class="ic">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p></div>`).join('');
 $('#polAcc').innerHTML=P.map(p=>`<details><summary>${p[1]}</summary><div class="a">${p[2]} ${p[3]}</div></details>`).join('');
 $('#faqAcc').innerHTML=t('faq').map(q=>`<details><summary>${q[0]}</summary><div class="a">${q[1]}</div></details>`).join('');
 $('#thumbs').innerHTML=IMGS.map((m,i)=>`<button class="${i===gi?'on':''}" data-i="${i}" aria-label="${m[1]}"><img loading="lazy" src="${m[0]}" alt="${m[2]}"></button>`).join('');
 setG(gi);total();$('#sub').textContent=t('submit');
 $('#cp').textContent=t('copy');$$('.rv:not(.in)').forEach(e=>io.observe(e));
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function setG(i){gi=(i+IMGS.length)%IMGS.length;const im=$('#gImg');im.style.opacity=0;setTimeout(()=>{im.src=IMGS[gi][0];im.alt=IMGS[gi][2];im.style.opacity=1},150);$$('#thumbs button').forEach((b,j)=>b.classList.toggle('on',j===gi))}
$('#thumbs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setG(+b.dataset.i)});
const lb=$('#lb'),openLb=()=>{$('#lbImg').src=IMGS[gi][0];$('#lbImg').alt=IMGS[gi][2];lb.classList.add('open')};
$('#gMain').addEventListener('click',openLb);$('#gMain').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb()}});
const lbMove=d=>{setG(gi+d);$('#lbImg').src=IMGS[gi][0]};
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');lb.querySelector('.pv').onclick=()=>lbMove(-1);lb.querySelector('.nx').onclick=()=>lbMove(1);
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('open')});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')lbMove(-1);if(e.key==='ArrowRight')lbMove(1)});
let tx=0;lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)lbMove(d>0?-1:1)});

$('#langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';safeStore.set('sj_lang',lang);render();$('#msg').className='msg';$$('.f').forEach(f=>{f.classList.remove('err');f.querySelector('.em')&&(f.querySelector('.em').textContent='')})};
$('#burger').onclick=()=>{const o=$('#menu').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
$$('#menu a').forEach(a=>a.onclick=()=>$('#menu').classList.remove('open'));
const hero=$('.hero');
addEventListener('scroll',()=>{$('#hd').classList.toggle('sc',scrollY>20);syncSticky()},{passive:true});

/* Countdown (client-side only) */
let end=Number(safeStore.get('sj_end'));
if(!end){end=Date.now()+CONFIG.COUNTDOWN_MINUTES*60000;safeStore.set('sj_end',String(end))}
function tick(){const r=end-Date.now();if(r<=0){$('#tm').textContent=t('tmEnd');return}const m=String(Math.floor(r/60000)).padStart(2,'0'),s=String(Math.floor(r%60000/1000)).padStart(2,'0');$('#tm').textContent=t('tmL')+m+':'+s}
setInterval(tick,1000);

/* Sticky CTA: chỉ mobile, ẩn khi đã tới form hoặc đang nhập */
let typing=false;const st=$('#sticky');
function syncSticky(){const past=hero.getBoundingClientRect().bottom<0,f=$('#order').getBoundingClientRect(),inForm=f.top<innerHeight&&f.bottom>0;
 st.classList.toggle('show',past);st.classList.toggle('hide',inForm||typing)}
$$('#frm input,#frm textarea').forEach(i=>{i.addEventListener('focus',()=>{typing=true;syncSticky()});i.addEventListener('blur',()=>{typing=false;syncSticky()})});

/* Contact popovers */
const pop=$('#pop');let cur=null;
function showPop(kind,btn){if(cur===kind&&pop.classList.contains('open')){pop.classList.remove('open');return}
 cur=kind;btn.classList.add('seen');$('#popT').textContent=kind==='z'?t('zaloT'):t('phoneT');$('#popN').textContent=CONFIG.PHONE_NUMBER;
 const go=$('#go');$('#popW').textContent='';go.style.display='';
 if(kind==='p'){go.textContent=t('call');go.href='tel:'+CONFIG.PHONE_NUMBER;go.removeAttribute('target')}
 else if(CONFIG.ZALO_URL){go.textContent=t('openZ');go.href=CONFIG.ZALO_URL;go.target='_blank'}
 else{go.style.display='none';$('#popW').textContent=t('noZ')}
 pop.classList.add('open')}
$('#zBtn').onclick=()=>showPop('z',$('#zBtn'));$('#pBtn').onclick=()=>showPop('p',$('#pBtn'));
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(CONFIG.PHONE_NUMBER)}catch(e){const r=document.createRange();r.selectNode($('#popN'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}
 $('#cp').textContent=t('copied');setTimeout(()=>$('#cp').textContent=t('copy'),1500)};
document.addEventListener('click',e=>{if(!e.target.closest('#pop,#float'))pop.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pop.classList.remove('open')});

/* Form */
const qtyEl=$('#qty');
function qv(){const q=parseInt(qtyEl.value,10);return q>=1&&q<=10?q:null}
function total(){const q=qv();$('#tot').textContent=q?fmt(CONFIG.PRODUCT_PRICE*q):'—'}
qtyEl.addEventListener('input',total);
const PH=/^(0|\+84)(3|5|7|8|9)\d{8}$/;
function setErr(id,msg){const f=$('#'+id).closest('.f');f.classList.toggle('err',!!msg);f.querySelector('.em').textContent=msg||''}
function validate(){const n=$('#name').value.trim(),p=$('#phone').value.replace(/[\s.\-]/g,''),a=$('#address').value.trim();
 const e={name:n.length<2?t('eName'):'',phone:PH.test(p)?'':t('ePhone'),address:a.length<8?t('eAddr'):'',qty:qv()?'':t('eQty')};
 Object.keys(e).forEach(k=>setErr(k,e[k]));const first=Object.keys(e).find(k=>e[k]);if(first)$('#'+first).focus();return !first}
let reqId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),busy=false;
const contact=()=>`${CONFIG.PHONE_NUMBER}`;
$('#frm').addEventListener('submit',async ev=>{ev.preventDefault();if(busy||!validate())return;
 const msg=$('#msg'),btn=$('#sub');msg.className='msg';
 if(CONFIG.GOOGLE_SCRIPT_URL.startsWith('PASTE_')){msg.className='msg bad';msg.textContent=t('bad')+contact();return}
 busy=true;btn.disabled=true;btn.textContent=t('sending');
 const body={name:$('#name').value.trim(),phone:$('#phone').value.trim(),address:$('#address').value.trim(),quantity:qv(),note:$('#note').value.trim(),website:$('#website').value,lang,requestId:reqId};
 try{
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
  // text/plain = "simple request" → không preflight CORS; Apps Script vẫn đọc được e.postData.contents
  const res=await fetch(CONFIG.GOOGLE_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal});
  clearTimeout(to);const j=await res.json();
  if(j&&j.ok){msg.className='msg ok';msg.innerHTML=`<b>${t('okT')}${j.orderId}</b><br>${t('okS')}`;$('#frm').reset();qtyEl.value=1;total();reqId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
  else{msg.className='msg bad';msg.textContent=t('bad')+contact()}
 }catch(err){msg.className='msg bad';msg.textContent=t('unk')+contact()} // không đọc được phản hồi ⇒ KHÔNG báo thành công; giữ nguyên reqId để retry không tạo đơn trùng
 busy=false;btn.disabled=false;btn.textContent=t('submit');msg.scrollIntoView({block:'center'})});

render();tick();syncSticky();
</script>
</body>
</html>
